models:
  ollama_host: "http://localhost:11434"
  orchestrator: "llama3.1"
  extractor: "llama3.1"
  enricher: "llama3.1"
  validator: "llama3.1"

crawling:
  max_concurrent: 10
  timeout: 30
  retry_attempts: 3
  fallback_to_firecrawl: true

extraction:
  fields:
    - name
    - role
    - linkedin
    - company
    - company_domain
    - email
    - phone_number
  confidence_threshold: 0.5

validation:
  email_validation: true
  phone_validation: true
  url_validation: true
