models:
  ollama_host: "http://localhost:11434"
  orchestrator: "gpt-oss:120b-cloud"
  extractor: "gpt-oss:20b-cloud"
  enricher: "gpt-oss:20b-cloud"
  validator: "gpt-oss:20b-cloud"

crawling:
  max_concurrent: 10
  timeout: 30
  retry_attempts: 3
  fallback_to_firecrawl: true

extraction:
  fields:
    - name
    - role
    - linkedin
    - company
    - company_domain
    - email
    - phone_number
  confidence_threshold: 0.5

validation:
  email_validation: true
  phone_validation: true
  url_validation: true

# Apify Configuration
apify:
  actor_id: "oJMZe85C0opC0xcx2"
  batch_size: 20
  timeout_seconds: 3600
  retries: 3
  # api_token should be set via environment variable APIFY_API_TOKEN

web_navigator:
  use_firecrawl: true
  use_apify: true

